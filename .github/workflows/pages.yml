name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Explicit permissions so deploy never depends on the repo's default
# GITHUB_TOKEN setting (which can be flipped to read-only by org policy).
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp last-updated timestamp from latest commit
        run: |
          TS=$(TZ=America/New_York git log -1 --format=%cd --date='format-local:%b %-d, %Y · %-I:%M %p %Z')
          echo "Stamping header timestamp: $TS"
          # Rewrite the visible text inside the "Updated ... </a>" header link.
          sed -i -E "s#(>Updated )[^<]*(</a>)#\1${TS}\2#" index.html
          grep -n ">Updated " index.html || (echo "ERROR: timestamp marker not found" && exit 1)

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the repository root (index.html + assets/ + images/).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
