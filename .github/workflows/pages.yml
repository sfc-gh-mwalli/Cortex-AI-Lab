name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Explicit permissions so deploy never depends on the repo's default
# GITHUB_TOKEN setting (which can be flipped to read-only by org policy).
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp last-updated timestamp from latest commit
        run: |
          TS=$(TZ=America/New_York git log -1 --format=%cd --date='format-local:%b %-d, %Y · %-I:%M %p %Z')
          echo "Stamping timestamp: $TS"
          # Rewrite every <span class="last-updated"> (header link and footer).
          sed -i -E "s#(<span class=\"last-updated\">)[^<]*(</span>)#\1${TS}\2#g" index.html
          grep -n 'class="last-updated"' index.html
          COUNT=$(grep -o 'class="last-updated"' index.html | wc -l)
          [ "$COUNT" -eq 2 ] || (echo "ERROR: expected 2 timestamp markers, found $COUNT" && exit 1)

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the repository root (index.html + assets/ + images/).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
