  - name: PROCEDURES
    description: "The table contains records of clinical procedures performed during patient care, including timing, coding, and associated descriptive and financial information. Each record is scoped to a specific procedure tied to a patient and encounter, with details such as procedure identity, start and stop dates, standardized code and text description, cost, and the documented reason for the procedure."
    base_table:
      database: SYNTHEA
      schema: SILVER
      table: PROCEDURES
