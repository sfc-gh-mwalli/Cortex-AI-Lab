name: VBC_ANALYTICS_SV
tables:
  - name: CONDITIONS
    description: "The table contains records of clinical conditions associated with patients and their encounters, capturing the condition’s active period. Each record represents a specific condition instance for a patient within an encounter, including the source system, standardized code and descriptive text, and the applicable geographic context."
    base_table:
      database: SYNTHEA
      schema: SILVER
      table: CONDITIONS
    dimensions:
      - name: CODE
        description: Diagnosis code from SNOMED-CT
        expr: CODE
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "314529007"
          - "124171000119105"
          - "22253000"
      - name: CONDITION_ID
        description: CONDITIONS primary key
        expr: CONDITION_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "1008934"
          - "1008936"
          - "1009040"
      - name: DESCRIPTION
        description: Description of the condition.
        expr: DESCRIPTION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Metastatic malignant neoplasm to prostate (disorder)
          - Polyp of colon
          - Laceration - injury (disorder)
      - name: ENCOUNTER_ID
        description: Foreign key to Primary key in Encounters table
        expr: ENCOUNTER_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "38695487"
          - "32172803"
          - "32119448"
      - name: PATIENT_ID
        description: Foreign key to primary key in Patietns table.
        expr: PATIENT_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "1561824"
          - "2202227"
          - "1561822"
      - name: SYNTHEA_CITY
        description: City generated by Synthea.
        expr: SYNTHEA_CITY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - WASHINGTON DC
          - SAN FRANCISCO
          - NASHVILLE
      - name: _SYSTEM
        description: Coding system for the code
        expr: '"SYSTEM"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - SNOMED-CT
          - http://snomed.info/sct
    time_dimensions:
      - name: CONDITION_START
        description: The date the condition was diagnosed.
        expr: CONDITION_START
        data_type: DATE
        access_modifier: public_access
        sample_values:
          - "11989"
          - "18382"
          - "18421"
      - name: CONDITION_STOP
        description: "The date the condition resolved, if applicable."
        expr: CONDITION_STOP
        data_type: DATE
        access_modifier: public_access
        sample_values:
          - "19709"
          - "13013"
          - "17775"
  - name: ENCOUNTERS
    description: "The table contains records of clinical encounters, including timing, participating parties, and associated service and billing details. Each record spans a single encounter for a specific patient and includes organization and provider context, payer and encounter classifications, reason information, and cost and claim amounts with payer coverage, along with descriptive diagnosis or service coding information."
    base_table:
      database: SYNTHEA
      schema: SILVER
      table: ENCOUNTERS
    primary_key:
      columns:
        - ENCOUNTER_ID
    dimensions:
      - name: CODE
        description: Encounter code from SNOMED-CT.
        expr: CODE
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "185349003"
          - "79094001"
          - "223484005"
      - name: DESCRIPTION
        description: Description of the type of encounter.
        expr: DESCRIPTION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Prenatal visit
          - Encounter for check up (procedure)
          - Follow-up encounter (procedure)
      - name: ENCOUNTERCLASS
        description: "The class of the encounter, such as ambulatory, emergency, inpatient, wellness, or urgentcare."
        expr: ENCOUNTERCLASS
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - outpatient
          - ambulatory
          - home
      - name: ENCOUNTER_ID
        description: Primary key for table Encounters.
        expr: ENCOUNTER_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "48873117"
          - "48872783"
          - "4502086"
      - name: ORGANIZATION_ID
        description: Foreign key to primary key in Organizations table.
        expr: ORGANIZATION_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "1000514"
          - "1000302"
          - "1000773"
      - name: PATIENT_ID
        description: Foreign key to primary key in Patietns table.
        expr: PATIENT_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "1202056"
          - "1202058"
          - "2312349"
      - name: PAYER_ID
        description: Foreign key to primary key in Payers table.
        expr: PAYER_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "1000008"
          - "1000000"
          - "1000001"
      - name: PROVIDER_ID
        description: Foreign key to primary key in Providers table.
        expr: PROVIDER_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "3060055"
          - "3057431"
          - "3057313"
      - name: REASONCODE
        description: "Diagnosis code from SNOMED-CT, only if this encounter targeted a specific condition."
        expr: REASONCODE
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "103697008"
          - "431857002"
          - "6525002"
      - name: REASONDESCRIPTION
        description: Description of the reason code.
        expr: REASONDESCRIPTION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Polyp of colon
          - Gingivitis (disorder)
      - name: SYNTHEA_CITY
        description: City generated by Synthea.
        expr: SYNTHEA_CITY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - BOSTON
          - DETROIT
          - CHICAGO
      - name: ENCOUNTER_YEAR
        description: Calendar year of the encounter.
        expr: YEAR(ENCOUNTER_START)
        data_type: "NUMBER(4,0)"
        access_modifier: public_access
    facts:
      - name: BASE_ENCOUNTER_COST
        description: "The base cost of the encounter, not including any line item costs related to medications, immunizations, procedures, or other services."
        expr: BASE_ENCOUNTER_COST
        data_type: "NUMBER(38,2)"
        access_modifier: public_access
        sample_values:
          - "71.43"
          - "71.22"
          - "119.05"
      - name: PAYER_COVERAGE
        description: The amount of cost covered by the Payer.
        expr: PAYER_COVERAGE
        data_type: "NUMBER(38,2)"
        access_modifier: public_access
        sample_values:
          - "383.86"
          - "11980.20"
          - "1649.36"
      - name: TOTAL_CLAIM_COST
        description: "The total cost of the encounter, including all line items."
        expr: TOTAL_CLAIM_COST
        data_type: "NUMBER(38,2)"
        access_modifier: public_access
        sample_values:
          - "71.43"
          - "940.63"
          - "615.20"
    time_dimensions:
      - name: ENCOUNTER_START
        description: The date and time the encounter started.
        expr: ENCOUNTER_START
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
        sample_values:
          - "274250493.000000000"
          - "1101499010.000000000"
          - "1705691668.000000000"
      - name: ENCOUNTER_STOP
        description: The date and time the encounter concluded.
        expr: ENCOUNTER_STOP
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
        sample_values:
          - "890524157.000000000"
          - "1717328537.000000000"
          - "1601744687.000000000"
      - name: ENCOUNTER_MONTH
        description: Month of the encounter (first day of the month).
        expr: DATE_TRUNC('MONTH', ENCOUNTER_START)
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
    metrics:
      - name: TOTAL_COST_OF_CARE
        description: Total cost of care across all encounters.
        expr: SUM(TOTAL_CLAIM_COST)
        access_modifier: public_access
      - name: PAYER_COVERAGE_RATE
        description: Share of total claim cost covered by the payer.
        expr: DIV0(SUM(PAYER_COVERAGE), SUM(TOTAL_CLAIM_COST))
        access_modifier: public_access
      - name: AVG_COST_PER_ENCOUNTER
        description: Average total claim cost per encounter.
        expr: AVG(TOTAL_CLAIM_COST)
        access_modifier: public_access
      - name: TOTAL_ENCOUNTER_COUNT
        description: Total count of encounters.
        expr: COUNT(ENCOUNTER_ID)
        access_modifier: public_access
      - name: AVOIDABLE_ED_RATE
        description: Rate of avoidable ED visits for ambulatory-sensitive conditions relative to total encounters.
        expr: DIV0(SUM(CASE WHEN ENCOUNTERCLASS = 'emergency' AND REASONCODE IN ('59621000','15777000','195662009','10509002','444814009','40055000','271737000','427898007','195967001','233604007','82423001','431855005','431856006','162864005') THEN 1 ELSE 0 END), COUNT(ENCOUNTER_ID))
        access_modifier: public_access
  - name: MEDICATIONS
    description: "The table contains records of medication usage tied to patient care episodes. Each record covers a prescribed medication with its administration timeframe, identifiers for the patient, care encounter, and payer, as well as clinical codes and descriptions, dispensing and cost details, and payer coverage information."
    base_table:
      database: SYNTHEA
      schema: SILVER
      table: MEDICATIONS
    dimensions:
      - name: CODE
        description: Medication code from RxNorm.
        expr: CODE
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "308136"
          - "751905"
          - "310798"
      - name: DESCRIPTION
        description: Description of the medication.
        expr: DESCRIPTION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - albuterol 0.83 MG/ML Inhalation Solution
          - sulfamethoxazole 800 MG / trimethoprim 160 MG Oral Tablet
          - "Acetaminophen 325 MG Oral Tablet [Tylenol]"
      - name: DISPENSES
        description: The number of times the prescription was filled.
        expr: DISPENSES
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "12"
          - "1"
          - "3"
      - name: ENCOUNTER_ID
        description: Primary key for table Encounters.
        expr: ENCOUNTER_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "27516389"
          - "23351726"
          - "27516230"
      - name: MEDICATION_ID
        description: MEDICATIONS primary key
        expr: MEDICATION_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "49481547"
          - "49481305"
          - "49481396"
      - name: PATIENT_ID
        description: Foreign key to primary key in Patients table.
        expr: PATIENT_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "1714061"
          - "1948449"
          - "1818213"
      - name: PAYER_ID
        description: Foreign key to primary key in Payers table.
        expr: PAYER_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "1000041"
          - "1000040"
          - "1000042"
      - name: REASONCODE
        description: Diagnosis code from SNOMED-CT specifying why this medication was prescribed.
        expr: REASONCODE
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "44054006"
          - "271737000"
          - "67811000119102"
      - name: REASONDESCRIPTION
        description: Description of the reason code.
        expr: REASONDESCRIPTION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Prediabetes
          - History of renal transplant (situation)
          - Essential hypertension (disorder)
      - name: SYNTHEA_CITY
        description: City generated by Synthea.
        expr: SYNTHEA_CITY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - NASHVILLE
          - WASHINGTON DC
          - CLEVELAND
    facts:
      - name: BASE_COST
        description: The line item cost of the medication.
        expr: BASE_COST
        data_type: "NUMBER(38,2)"
        access_modifier: public_access
        sample_values:
          - "0.73"
          - "510.93"
          - "1.41"
      - name: PAYER_COVERAGE
        description: The amount covered or reimbursed by the Payer.
        expr: PAYER_COVERAGE
        data_type: "NUMBER(38,2)"
        access_modifier: public_access
        sample_values:
          - "46.98"
          - "1.59"
          - "4.99"
      - name: TOTALCOST
        description: "The total cost of the prescription, including all dispenses."
        expr: TOTALCOST
        data_type: "NUMBER(38,2)"
        access_modifier: public_access
        sample_values:
          - "94.90"
          - "204.08"
          - "429.96"
    time_dimensions:
      - name: MED_START
        description: The date and time the medication was prescribed.
        expr: MED_START
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
        sample_values:
          - "730249120.000000000"
          - "1653017170.000000000"
          - "1180172119.000000000"
      - name: MED_STOP
        description: "The date and time the prescription ended, if applicable."
        expr: MED_STOP
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
        sample_values:
          - "1652745239.000000000"
          - "273966318.000000000"
          - "1178473692.000000000"
  - name: OBSERVATIONS
    description: "The table contains records of clinical observations made for patients during specific encounters. Each record captures the observation date and patient and encounter identifiers, along with a coded category and description and the measured value with units and a type classification."
    base_table:
      database: SYNTHEA
      schema: SILVER
      table: OBSERVATIONS
    dimensions:
      - name: CATEGORY
        description: Observation category.
        expr: CATEGORY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - laboratory
          - vital-signs
      - name: CODE
        description: Observation or Lab code from LOINC
        expr: CODE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - 39156-5
          - 718-7
          - 76437-3
      - name: DESCRIPTION
        description: "\tDescription of the observation or lab."
        expr: DESCRIPTION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - "Chloride [Moles/volume] in Blood"
          - "Carbon dioxide  total [Moles/volume] in Blood"
          - Within the last year  have you been afraid of your partner or ex-partner?
      - name: ENCOUNTER_ID
        description: Primary key for table Encounters.
        expr: ENCOUNTER_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "33118671"
          - "33118837"
          - "33118765"
      - name: OBSERVATION_ID
        description: OBSERVATIONS primary key
        expr: OBSERVATION_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "66971827"
          - "66971975"
          - "66971822"
      - name: PATIENT_ID
        description: Foreign key to primary key in Patietns table.
        expr: PATIENT_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "1528415"
          - "1528412"
          - "1698940"
      - name: SYNTHEA_CITY
        description: City generated by Synthea.
        expr: SYNTHEA_CITY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - SAN FRANCISCO
          - DETROIT
          - WASHINGTON DC
      - name: UNITS
        description: The units of measure for the value.
        expr: UNITS
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - mmol/L
          - mg/dL
          - "mL/min/{1.73_m2}"
      - name: VALUE
        description: The recorded value of the observation.
        expr: VALUE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Part-time or temporary work
          - "110.0"
          - Medicare
      - name: _TYPE
        description: "The datatype of Value: text or numeric"
        expr: '"TYPE"'
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - numeric
          - text
    time_dimensions:
      - name: OBSERVATION_DATE
        description: The date and time the observation was performed.
        expr: OBSERVATION_DATE
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
        sample_values:
          - "826836895.000000000"
          - "1262059641.000000000"
          - "1482795760.000000000"
  - name: PATIENTS
    description: "The table contains records of individuals’ patient demographics and identity attributes. Each record covers personal identifiers, birth and (if applicable) death dates, basic biographical data such as name components, marital and ethnicity details, and location information including address, city, and state."
    base_table:
      database: SYNTHEA
      schema: SILVER
      table: PATIENTS
    primary_key:
      columns:
        - PATIENT_ID
    dimensions:
      - name: ADDRESS
        description: Patient street address without commas or newlines.
        expr: ADDRESS
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - 179 Ferry Path Suite 4
          - 380 Bernhard Gateway
          - 477 Wolf Parade Apt 20
      - name: BIRTHPLACE
        description: Name of the town where the patient was born.
        expr: BIRTHPLACE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Johnson City  Tennessee  US
          - Lakewood Park  Tennessee  US
          - Red Bank  Tennessee  US
      - name: CITY
        description: Patient address city.
        expr: CITY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Cleveland
          - San Francisco
          - Pittsburgh
      - name: COUNTY
        description: Patient address county.
        expr: COUNTY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - San Francisco County
          - DuPage County
          - Salt Lake County
      - name: DRIVERS
        description: Patient Drivers License identifier.
        expr: DRIVERS
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - S99931537
          - S99994305
          - S99968197
      - name: ETHNICITY
        description: Description of the patient primary ethnicity.
        expr: ETHNICITY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - nonhispanic
          - hispanic
      - name: FIPS
        description: Patient FIPS county code.
        expr: FIPS
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "47037"
          - "47187"
          - "47165"
      - name: FIRST
        description: First name of the patient.
        expr: FIRST
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Kristyn
          - Buffy
          - Lyndon
      - name: GENDER
        description: "Gender. M is male, F is female."
        expr: GENDER
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - M
          - F
      - name: INCOME
        description: Annual income for the Patient
        expr: INCOME
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "74023"
          - "20895"
          - "256755"
      - name: LAST
        description: Last or surname of the patient.
        expr: LAST
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Fahey
          - Prohaska
          - Cadena
      - name: MAIDEN
        description: Maiden name of the patient.
        expr: MAIDEN
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Franecki
          - Bosco
          - Altenwerth
      - name: MARITAL
        description: "Marital Status. M is married, S is single. Currently no support for divorce (D) or widowing (W)"
        expr: MARITAL
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - M
          - S
          - D
      - name: MIDDLE
        description: Middle name of the patient.
        expr: MIDDLE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Rupert
          - Billie
          - Afton
      - name: PASSPORT
        description: Patient Passport identifier.
        expr: PASSPORT
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - X81373281X
          - X35262507X
      - name: PATIENT_ID
        description: Primary key for PATIENTS table.
        expr: PATIENT_ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "1446181"
          - "1016218"
          - "1446176"
      - name: PREFIX
        description: "Name prefix, such as Mr., Mrs., Dr., etc."
        expr: PREFIX
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Mrs.
          - Mr.
          - Ms.
      - name: RACE
        description: Description of the patient primary race.
        expr: RACE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - hawaiian
          - black
          - asian
      - name: SSN
        description: Patient Social Security identifier.
        expr: SSN
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - 999-17-7532
          - 999-83-7913
          - 999-10-2774
      - name: STATE
        description: Patient address state.
        expr: STATE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Florida
          - Ohio
          - District of Columbia
      - name: SUFFIX
        description: "Name suffix, such as PhD, MD, JD, etc."
        expr: SUFFIX
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - PhD
          - MD
      - name: SYNTHEA_CITY
        description: City generated by Synthea.
        expr: SYNTHEA_CITY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - BOSTON
          - NASHVILLE
          - CHICAGO
      - name: ZIP
        description: Patient zip code.
        expr: ZIP
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "44120"
          - "84044"
          - "94129"
      - name: PATIENT_INCOME_BAND
        description: "Patient income band: <30k, 30-60k, 60-100k, 100k+, or Unknown."
        expr: CASE WHEN INCOME < 30000 THEN '<30k' WHEN INCOME >= 30000 AND INCOME < 60000 THEN '30-60k' WHEN INCOME >= 60000 AND INCOME < 100000 THEN '60-100k' WHEN INCOME >= 100000 THEN '100k+' ELSE 'Unknown' END
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: HEALTHCARE_COVERAGE
        description: The total lifetime cost of healthcare services that were covered by Payers (i.e. what the insurance company paid).
        expr: HEALTHCARE_COVERAGE
        data_type: "NUMBER(38,2)"
        access_modifier: public_access
        sample_values:
          - "5252.98"
          - "547031.40"
          - "920640.44"
      - name: HEALTHCARE_EXPENSES
